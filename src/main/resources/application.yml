server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: credicasa-mortgage-service
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:credicasa_db}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: simple
    cache-names:
      - sbsRates

app:
  security:
    jwt:
      secret: ${JWT_SECRET:CrediCasaFidiaCorpSuperSecureJwtSigningKey2026Secure256BitsMinimum}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Springdoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.fidiacorp.credicasa: DEBUG
    org.springframework.security: INFO
