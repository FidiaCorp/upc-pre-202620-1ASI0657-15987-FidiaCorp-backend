server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: quotation-deal-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quotation_db}
    username: ${SPRING_DATASOURCE_USERNAME:quotation_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  internal:
    token: ${INTERNAL_API_TOKEN:}
  security:
    jwt:
      secret: ${JWT_SECRET}
  services:
    identity-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    pricing-url: ${PRICING_SERVICE_URL:http://localhost:8083}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      interval-ms: 1000
      batch-size: 50

resilience4j:
  circuitbreaker:
    configs:
      downstream:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.fidiacorp.credicasa.shared.error.UpstreamServiceException
    instances:
      identityService:
        base-config: downstream
      catalogService:
        base-config: downstream
      pricingService:
        base-config: downstream

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    rabbit:
      enabled: false
    circuitbreakers:
      enabled: false
