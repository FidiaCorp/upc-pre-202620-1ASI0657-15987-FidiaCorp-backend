name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    name: mvn clean verify (7 módulos · ArchUnit · Cucumber · JaCoCo · PostgreSQL 16 embebido)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test all modules
        run: mvn -B -ntp clean verify
      - name: Publish test, Cucumber and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            **/target/surefire-reports/
            **/target/cucumber/
            **/target/site/jacoco/
            **/target/openapi/
          if-no-files-found: warn

  docker:
    name: docker compose config + build de imágenes
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: FRONTEND_CONTEXT=. docker compose config --quiet
      - name: Build microservice images
        run: |
          for module in api-gateway identity-subscription-service property-catalog-service mortgage-pricing-service quotation-deal-service communication-notification-service; do
            docker build -f "$module/Dockerfile" -t "credicasa/$module:ci" .
          done
