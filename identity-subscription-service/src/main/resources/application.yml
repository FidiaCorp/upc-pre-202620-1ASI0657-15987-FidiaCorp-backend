server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: identity-subscription-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${SPRING_DATASOURCE_USERNAME:identity_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  internal:
    token: ${INTERNAL_API_TOKEN:}
  e2e:
    fixture-token: ${APP_E2E_FIXTURE_TOKEN:}
  bootstrap:
    # Correos (separados por comas) de cuentas ya registradas que se promueven a ROLE_REALTOR al iniciar.
    realtor-emails: ${REALTOR_BOOTSTRAP_EMAILS:}
  security:
    two-factor:
      encryption-key: ${TWO_FACTOR_ENCRYPTION_KEY:}
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  payments:
    sandbox-secret: ${PAYMENT_SANDBOX_SECRET:credicasa-sandbox-only-signing-key-change-me-2026}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
  level:
    root: INFO
    com.fidiacorp.credicasa: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
