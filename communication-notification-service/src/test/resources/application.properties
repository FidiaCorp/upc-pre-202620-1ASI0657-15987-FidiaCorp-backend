spring.datasource.url=jdbc:h2:mem:communication_${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
app.security.jwt.secret=TestOnlyJwtSigningKeyForIsolatedIntegrationTests123456789
spring.rabbitmq.listener.simple.auto-startup=false
app.services.identity-url=http://127.0.0.1:9
app.services.catalog-url=http://127.0.0.1:9
logging.level.root=WARN
